name: Build and Release DocLite

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'art/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional manual version override (e.g., v1.0.5)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 1. Gate 1: Strict Unit Test Verification
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # 2. Gate 2: Release Secrets Validation
      - name: Validate Release Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING="$MISSING RELEASE_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && MISSING="$MISSING RELEASE_STORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && MISSING="$MISSING RELEASE_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && MISSING="$MISSING RELEASE_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required repository release secrets:$MISSING"
            echo "Configure them in GitHub: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      # 3. Auto Version Bump & Release Naming
      - name: Determine Version & Auto-Bump
        id: versioning
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          echo "Previous tag found: $LATEST_TAG"
          
          CLEAN_VER="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          NEXT_PATCH=$((PATCH + 1))
          AUTO_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            CUSTOM="${{ github.event.inputs.version_name }}"
            [[ "$CUSTOM" != v* ]] && CUSTOM="v$CUSTOM"
            FINAL_TAG="$CUSTOM"
          else
            FINAL_TAG="$AUTO_TAG"
          fi
          
          CLEAN_VERSION="${FINAL_TAG#v}"
          RELEASE_TITLE="DocLite $FINAL_TAG"
          
          echo "tag=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "previous_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # 4. Decode Keystore
      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | base64 -d > release.jks

      # 5. Build Release APK
      - name: Build Release APK
        env:
          APP_VERSION_NAME: ${{ steps.versioning.outputs.clean_version }}
          APP_VERSION_CODE: ${{ github.run_number }}
          RELEASE_STORE_FILE: ../release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # 6. Prepare Release Assets & Changelog
      - name: Prepare Release Assets & Changelog
        id: release_notes
        run: |
          PREV_TAG="${{ steps.versioning.outputs.previous_tag }}"
          CURRENT_TAG="${{ steps.versioning.outputs.tag }}"
          
          # Copy to branded release filename
          cp app/build/outputs/apk/release/app-release.apk "DocLite-${CURRENT_TAG}.apk"
          
          # Compute SHA-256 checksum
          SHA256=$(sha256sum "DocLite-${CURRENT_TAG}.apk" | awk '{print $1}')
          
          # Extract commit log
          if git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" --no-merges)
          else
            COMMITS=$(git log -n 10 --pretty=format:"* %s (%h)" --no-merges)
          fi
          
          if [ -z "$COMMITS" ]; then
            COMMITS="* Maintenance, security hardening, and performance updates."
          fi
          
          cat << 'EOF' > release_body.md
          ## 🚀 What's New in ${{ steps.versioning.outputs.release_title }}
          
          EOF
          
          echo "$COMMITS" >> release_body.md
          
          cat << EOF >> release_body.md
          
          ---
          
          ### 📦 Included Downloads
          * **Branded Release**: \`DocLite-${CURRENT_TAG}.apk\`
          * **Direct Download**: \`app-release.apk\`
          
          ### 🛡️ SHA-256 Checksum
          \`\`\`
          $SHA256
          \`\`\`
          
          ### 🔒 Privacy & Compliance
          * **100% Offline**: All parsing and rendering executes on-device with zero tracking.
          * **Scoped Storage**: Full compatibility with Android 7.0 (API 24) through Android 16 (API 36).
          * **License**: GNU General Public License v2.0 (Non-Commercial).
          EOF

      # 7. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: ${{ steps.versioning.outputs.release_title }}
          body_path: release_body.md
          files: |
            DocLite-${{ steps.versioning.outputs.tag }}.apk
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: false
