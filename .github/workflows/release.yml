name: Build, Sign and Release DocLite

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'art/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional version tag override (e.g. v1.0.5)'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-sign-release:
    name: Build, Sign & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # 1. Gate 1: Strict Unit Test Verification
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # 2. Gate 2: Release Signing Keystore Setup
      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_AL: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "::notice::Using official repository secret signing keystore."
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "SIGNING_STORE_PASS=${STORE_PASS:-doclite_secure_2026}" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=${KEY_AL:-doclite_secure}" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASS=${KEY_PASS:-doclite_secure_2026}" >> $GITHUB_ENV
            echo "is_custom_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not found. Generating a secure CI fallback keystore."
            echo "To use your production signing key, add RELEASE_KEYSTORE_BASE64 to GitHub Settings -> Secrets -> Actions."
            keytool -genkeypair -v -keystore release.jks -alias doclite_secure \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass doclite_secure_2026 -keypass doclite_secure_2026 \
              -dname "CN=DocLite CI, OU=Release, O=HrshD1eux, C=US"
            echo "SIGNING_STORE_PASS=doclite_secure_2026" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=doclite_secure" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASS=doclite_secure_2026" >> $GITHUB_ENV
            echo "is_custom_keystore=false" >> $GITHUB_OUTPUT
          fi

      # 3. Version Resolution & Auto-Bump
      - name: Resolve Version
        id: versioning
        run: |
          git fetch --tags --force
          
          # Check if triggered by tag push
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_FROM_REF="${GITHUB_REF#refs/tags/}"
            echo "Triggered by git tag: $TAG_FROM_REF"
            FINAL_TAG="$TAG_FROM_REF"
            PREV_TAG=$(git tag -l "v*" | grep -v "^${FINAL_TAG}$" | sort -V | tail -n 1)
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            CUSTOM="${{ github.event.inputs.version_name }}"
            [[ "$CUSTOM" != v* ]] && CUSTOM="v$CUSTOM"
            FINAL_TAG="$CUSTOM"
            PREV_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          else
            LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
            [ -z "$LATEST_TAG" ] && LATEST_TAG="v1.0.0"
            PREV_TAG="$LATEST_TAG"
            
            CLEAN_VER="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            NEXT_PATCH=$((PATCH + 1))
            FINAL_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          fi
          
          [ -z "$PREV_TAG" ] && PREV_TAG="v1.0.0"
          CLEAN_VERSION="${FINAL_TAG#v}"
          RELEASE_TITLE="DocLite $FINAL_TAG"
          
          echo "tag=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "release_title=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Building version: $FINAL_TAG ($CLEAN_VERSION)"

      # 4. Build Signed Release APK and Signed AAB (App Bundle)
      - name: Build Signed Release APK & Bundle
        env:
          APP_VERSION_NAME: ${{ steps.versioning.outputs.clean_version }}
          APP_VERSION_CODE: ${{ github.run_number }}
          RELEASE_STORE_FILE: ../release.jks
          RELEASE_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASS }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      # 5. Package Release Assets & Generate Checksums
      - name: Package Assets & Generate Checksums
        id: assets
        run: |
          CURRENT_TAG="${{ steps.versioning.outputs.tag }}"
          PREV_TAG="${{ steps.versioning.outputs.previous_tag }}"
          
          # Copy APK and AAB with branded version names
          cp app/build/outputs/apk/release/app-release.apk "DocLite-${CURRENT_TAG}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "DocLite-${CURRENT_TAG}.aab"
          
          # Generate SHA-256 Checksums
          sha256sum "DocLite-${CURRENT_TAG}.apk" \
                    app/build/outputs/apk/release/app-release.apk \
                    "DocLite-${CURRENT_TAG}.aab" \
                    app/build/outputs/bundle/release/app-release.aab > checksums.sha256
          
          APK_SHA=$(sha256sum "DocLite-${CURRENT_TAG}.apk" | awk '{print $1}')
          AAB_SHA=$(sha256sum "DocLite-${CURRENT_TAG}.aab" | awk '{print $1}')
          
          # Extract commit history for release notes
          if git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" --no-merges)
          else
            COMMITS=$(git log -n 12 --pretty=format:"* %s (%h)" --no-merges)
          fi
          
          if [ -z "$COMMITS" ]; then
            COMMITS="* Performance optimizations, UI enhancements, and security improvements."
          fi
          
          cat << 'EOF' > release_body.md
          ## 🚀 What's New in ${{ steps.versioning.outputs.release_title }}
          
          EOF
          
          echo "$COMMITS" >> release_body.md
          
          cat << EOF >> release_body.md
          
          ---
          
          ### 📦 Download Packages
          | Package | Description | Target |
          |---|---|---|
          | \`DocLite-${CURRENT_TAG}.apk\` | Standalone Signed APK | Android Devices (Direct Install) |
          | \`DocLite-${CURRENT_TAG}.aab\` | Signed Android App Bundle | Google Play Console Distribution |
          | \`app-release.apk\` | Direct Generic Release APK | Automated Installers / Updaters |
          | \`checksums.sha256\` | SHA-256 Hashes | Integrity Verification |
          
          ### 🛡️ SHA-256 Integrity Verification
          \`\`\`text
          APK: $APK_SHA
          AAB: $AAB_SHA
          \`\`\`
          
          ### 🔒 Privacy & Architecture
          * **100% Offline**: All document viewing, editing, and bank statement analytics are executed locally on-device. Zero cloud telemetry.
          * **Android Compatibility**: Android 7.0 (API 24) through Android 16 (API 36).
          * **License**: DocLite Source Code License (Non-Commercial Version 1.0).
          EOF
          
          if [ "${{ steps.keystore.outputs.is_custom_keystore }}" = "false" ]; then
            cat << 'EOF' >> release_body.md
          
          > [!NOTE]
          > This release was signed using a CI-generated signing key. To sign with your official production key, configure repository secrets in GitHub settings.
          EOF
          fi

      # 6. Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: ${{ steps.versioning.outputs.release_title }}
          body_path: release_body.md
          files: |
            DocLite-${{ steps.versioning.outputs.tag }}.apk
            app/build/outputs/apk/release/app-release.apk
            DocLite-${{ steps.versioning.outputs.tag }}.aab
            app/build/outputs/bundle/release/app-release.aab
            checksums.sha256
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: false

      # 7. Upload Build Artifacts (30 days retention)
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DocLite-${{ steps.versioning.outputs.tag }}-artifacts
          path: |
            DocLite-${{ steps.versioning.outputs.tag }}.apk
            DocLite-${{ steps.versioning.outputs.tag }}.aab
            checksums.sha256
          retention-days: 30
