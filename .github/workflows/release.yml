name: Build and Release DocLite

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'art/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g., v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 1. Gate 1: Strict Test Gate
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # 2. Gate 2: Release Secrets Validation
      - name: Validate Release Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          MISSING=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING="$MISSING RELEASE_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && MISSING="$MISSING RELEASE_STORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && MISSING="$MISSING RELEASE_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && MISSING="$MISSING RELEASE_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required repository release secrets:$MISSING"
            echo "Configure them in GitHub: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      # 3. Decode Keystore
      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | base64 -d > release.jks

      # 4. Build Release APK
      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: ../release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # 5. Determine Release Tag
      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            TAG="${{ github.event.inputs.version_name }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # 6. Publish GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
